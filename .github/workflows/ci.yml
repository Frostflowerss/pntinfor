name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build không cần Supabase thật — site tự dùng nội dung dự phòng.
          # Chỉ cần secret phiên để auth.ts không fail-closed lúc dựng trang.
          ADMIN_SESSION_SECRET: ${{ 'ci-placeholder-secret-that-is-long-enough-32' }}
          NEXT_PUBLIC_SITE_URL: https://example.com
